name: Agent Ingest

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: false
        default: ingest
        type: choice
        options:
          - ingest
          - inventory
          - maintenance
      type:
        description: Resource type/card
        required: false
        type: string
      category:
        description: Category
        required: false
        type: string
      title:
        description: Resource title
        required: false
        type: string
      url:
        description: Resource URL
        required: false
        type: string
      description:
        description: Resource description
        required: false
        type: string
      category_color:
        description: Category color (hex)
        required: false
        default: '#6366f1'
        type: string
      category_icon:
        description: Category icon
        required: false
        default: 'Folder'
        type: string
  push:
    branches:
      - agent-queue
    paths:
      - agent-queue.json

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout queue payload
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Run Link Manager agent action
        env:
          AGENT_INGEST_KEY: ${{ secrets.AGENT_INGEST_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_CATEGORY_COLOR: ${{ inputs.category_color }}
          INPUT_CATEGORY_ICON: ${{ inputs.category_icon }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_INGEST_KEY:-}" ]; then
            echo "AGENT_INGEST_KEY secret is not configured."
            exit 1
          fi

          ACTION="${INPUT_ACTION:-ingest}"

          if [ "$EVENT_NAME" = "push" ]; then
            ACTION=$(jq -r '.action // "ingest"' agent-queue.json)
            INPUT_TYPE=$(jq -r '.type // ""' agent-queue.json)
            INPUT_CATEGORY=$(jq -r '.category // ""' agent-queue.json)
            INPUT_TITLE=$(jq -r '.title // ""' agent-queue.json)
            INPUT_URL=$(jq -r '.url // ""' agent-queue.json)
            INPUT_DESCRIPTION=$(jq -r '.description // ""' agent-queue.json)
            INPUT_CATEGORY_COLOR=$(jq -r '.categoryColor // "#6366f1"' agent-queue.json)
            INPUT_CATEGORY_ICON=$(jq -r '.categoryIcon // "Folder"' agent-queue.json)
          fi

          response_file=$(mktemp)

          if [ "$ACTION" = "inventory" ]; then
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request GET \
              --header "X-Agent-Key: $AGENT_INGEST_KEY" \
              https://link.cheleby.qzz.io/agent/ingest/inventory)
          elif [ "$ACTION" = "maintenance" ]; then
            if [ "$EVENT_NAME" != "push" ]; then
              echo "maintenance is only supported from the reviewed queue payload."
              exit 1
            fi
            payload=$(jq '{merges: .merges, dryRun: (.dryRun // false)}' agent-queue.json)
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-Agent-Key: $AGENT_INGEST_KEY" \
              --data "$payload" \
              https://link.cheleby.qzz.io/agent/maintenance/categories)
          else
            if [ -z "${INPUT_TYPE:-}" ] || [ -z "${INPUT_CATEGORY:-}" ] || [ -z "${INPUT_TITLE:-}" ] || [ -z "${INPUT_URL:-}" ]; then
              echo "type, category, title and url are required for ingest."
              exit 1
            fi

            payload=$(jq -n \
              --arg type "$INPUT_TYPE" \
              --arg category "$INPUT_CATEGORY" \
              --arg title "$INPUT_TITLE" \
              --arg url "$INPUT_URL" \
              --arg description "$INPUT_DESCRIPTION" \
              --arg categoryColor "${INPUT_CATEGORY_COLOR:-#6366f1}" \
              --arg categoryIcon "${INPUT_CATEGORY_ICON:-Folder}" \
              '{
                type: $type,
                category: $category,
                title: $title,
                url: $url,
                description: (if $description == "" then null else $description end),
                categoryColor: $categoryColor,
                categoryIcon: $categoryIcon
              }')

            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-Agent-Key: $AGENT_INGEST_KEY" \
              --data "$payload" \
              https://link.cheleby.qzz.io/agent/ingest/)
          fi

          cat "$response_file"
          echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Agent action failed with HTTP $status"
            exit 1
          fi
